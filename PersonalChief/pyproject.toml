[project]
name = "langchain_demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akira", email = "552423801@qq.com" }
]
requires-python = ">=3.10,<3.12"
dependencies = [
    "alibabacloud-oss-v2>=1.4.1",
    "fastapi>=0.162.0",
    "fastmcp>=3.4.11",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.4.7",
    "langchain-classic>=1.0.8",
    "langchain-deepseek>=1.1.1",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langgraph-cli[inmem]>=0.4.40",
    "mineru-open-sdk>=0.2.5",
    "openai>=3.37.0",
    "psycopg[binary]>=3.3.6",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain = "my_chain:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pip>=26.2.2",
]
